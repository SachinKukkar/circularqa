[project]
name = "circularqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sachin Kukkar", email = "sachinkukkar1998@.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
circularqa = "circularqa:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
